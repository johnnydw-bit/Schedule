<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Moths Roll Up Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      max-width: 540px;
      margin: 0 auto;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    .header {
      background: #1a3a5c;
      color: #fff;
      padding: 18px 20px 14px;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .header a {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
    }
    .header a:hover { color: rgba(255,255,255,0.9); }

    /* ── Login form ── */
    .form-body { padding: 20px; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      margin-bottom: 5px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      color: #111;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: #1a3a5c; }
    .input-wrap { position: relative; }
    .input-wrap input { padding-right: 42px; }
    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      padding: 0;
      display: flex;
      align-items: center;
      line-height: 1;
    }
    .eye-btn:hover { color: #555; }

    .btn {
      width: 100%;
      padding: 14px;
      background: #1a3a5c;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .error-msg {
      color: #c0392b;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }

    /* ── Loading ── */
    #loading {
      display: none;
      padding: 40px 20px;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #eee;
      border-top-color: #1a3a5c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #777; font-size: 14px; }

    /* ── Results ── */
    #results { display: none; }

    .results-header {
      padding: 12px 20px 10px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .results-header .title { font-size: 13px; font-weight: 700; color: #333; }
    .results-header .as-of { font-size: 11px; color: #aaa; }

    /* ── Table ── */
    .moths-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .moths-table thead tr {
      background: #f7f8fa;
    }
    .moths-table thead th {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      padding: 8px 4px;
      text-align: center;
      width: 12.5%;
    }
    .moths-table thead th.day-head {
      color: #1a3a5c;
      border-bottom: 2px solid #1a3a5c;
      text-align: left;
      padding-left: 10px;
    }
    .moths-table thead th.entry-head {
      color: #1a3a5c;
    }

    .moths-table tbody tr { border-bottom: 1px solid #f5f5f5; }
    .moths-table tbody tr:last-child { border-bottom: none; }
    .moths-table tbody tr.past-week { opacity: 0.5; }

    /* Pending-change row: amber left border */
    .moths-table tbody tr.pending-change {
      background: #fffbf0;
    }
    .moths-table tbody tr.pending-change td:first-child {
      border-left: 3px solid #e8a020;
      padding-left: 13px;
    }

    .moths-table td {
      padding: 7px 4px;
      font-size: 13px;
      text-align: center;
      overflow: hidden;
    }
    .moths-table td.date-cell {
      color: #333;
      font-weight: 500;
      text-align: left;
      padding-left: 10px;
    }
    .moths-table td.date-cell a {
      color: #2471a3;
      text-decoration: none;
    }
    .moths-table td.date-cell a:hover { text-decoration: underline; }
    .moths-table td.status-cell {
      font-size: 14px;
      font-weight: 700;
    }
    .moths-table td.count-cell {
      font-size: 12px;
      color: #666;
    }
    .moths-table td.entry-cell {
      /* inherits text-align: center */
    }

    /* divider between Mon and Thu pairs */
    .moths-table td.thu-date-cell {
      border-left: 1px solid #ececec;
    }

    .status-tick  { color: #1e8449; }
    .status-cross { color: #c0392b; }
    .status-time  { color: #b7770d; }
    .status-error { color: #aaa; }

    .today-row td { background: #f0f7ff; }
    .today-row.pending-change td { background: #fffbf0; }

    /* ── Entry checkbox ── */
    .entry-cb {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #b0b8c4;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
      vertical-align: middle;
      display: inline-block;
      flex-shrink: 0;
    }
    .entry-cb:checked {
      background: #1a3a5c;
      border-color: #1a3a5c;
    }
    .entry-cb:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 0px;
      width: 6px;
      height: 10px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }
    .entry-cb:disabled {
      opacity: 0.25;
      cursor: default;
    }
    .entry-cb:not(:disabled):hover {
      border-color: #1a3a5c;
    }

    /* Row feedback states */
    .moths-table tbody tr.action-success td { background: #edfaf1 !important; }
    .moths-table tbody tr.action-error td   { background: #fef0ef !important; }

    /* Row-level feedback icon next to checkbox */
    .entry-feedback {
      font-size: 13px;
      margin-left: 2px;
      vertical-align: middle;
    }

    /* ── Clickable player count ── */
    .count-link {
      cursor: pointer;
      color: #2471a3;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .count-link:hover { color: #1a5276; }

    /* ── Players panel ── */
    #players-panel {
      display: none;
      margin: 0 12px 2px;
      padding: 10px 14px;
      background: #f0f7ff;
      border: 1px solid #c8dff5;
      border-radius: 8px;
    }
    #players-panel .pp-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    #players-panel .pp-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #1a3a5c;
    }
    #players-panel .pp-close {
      background: none;
      border: none;
      font-size: 14px;
      color: #888;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    #players-panel .pp-close:hover { color: #333; }
    #players-panel .pp-names {
      font-size: 13px;
      color: #333;
      line-height: 1.6;
    }

    /* ── Legend ── */
    .legend {
      display: flex;
      gap: 16px;
      padding: 10px 16px;
      border-top: 1px solid #f0f0f0;
      font-size: 11px;
      color: #888;
      flex-wrap: wrap;
    }
    .legend span { display: flex; align-items: center; gap: 5px; }

    /* ── Footer ── */
    .footer-btns {
      text-align: center;
      padding: 14px 20px 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      border-top: 1px solid #f0f0f0;
      flex-wrap: wrap;
    }
    .reset-btn {
      color: #888;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
    }
    .reset-btn:hover { color: #555; }

    .apply-btn {
      padding: 8px 16px;
      background: #e8a020;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .apply-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .apply-btn:not(:disabled):hover { opacity: 0.88; }

    /* Inline spinner for apply button */
    .apply-btn .btn-spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 5px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>🦋 Moths Roll Up Tracker</h1>
    <a href="index.html">← My Schedule</a>
  </div>

  <!-- Login -->
  <div id="login">
    <div class="form-body">
      <div class="field">
        <label>Email or Membership Number</label>
        <input id="member_id" type="text" inputmode="text"
               autocomplete="username" placeholder="your@email.com or 1234"/>
      </div>
      <div class="field">
        <label>PIN</label>
        <div class="input-wrap">
          <input id="pin" type="password" inputmode="numeric"
                 autocomplete="current-password" placeholder="••••"/>
          <button type="button" class="eye-btn" onclick="togglePin()" title="Show/hide PIN">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button class="btn" id="go-btn" onclick="startFetch()">Check Schedule</button>
      <div class="error-msg" id="err"></div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading" style="display:none">
    <div class="spinner"></div>
    <p id="loading-msg">Fetching roll up schedule…</p>
  </div>

  <!-- Results -->
  <div id="results" style="display:none">
    <div class="results-header">
      <span class="title">Mon &amp; Thu · 10am Roll Up</span>
      <span id="as-of" class="as-of"></span>
    </div>
    <table class="moths-table">
      <thead>
        <tr>
          <th class="day-head" colspan="4">Monday</th>
          <th class="day-head" colspan="4">Thursday</th>
        </tr>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th title="Players entered">#</th>
          <th class="entry-head" title="Tick to enter, untick to withdraw">In?</th>
          <th>Date</th>
          <th>Time</th>
          <th title="Players entered">#</th>
          <th class="entry-head" title="Tick to enter, untick to withdraw">In?</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <!-- Players panel (shown when a count is clicked) -->
    <div id="players-panel">
      <div class="pp-header">
        <span class="pp-title" id="pp-title">Players</span>
        <button class="pp-close" onclick="hidePlayers()" title="Close">✕</button>
      </div>
      <div class="pp-names" id="pp-names"></div>
    </div>

    <div class="legend">
      <span><span class="status-tick">10:00</span> on time</span>
      <span><span class="status-time">11:00</span> moved</span>
      <span><span class="status-cross">✗</span> not booked</span>
    </div>
    <div class="footer-btns">
      <button class="reset-btn" onclick="refresh()">↻ Refresh</button>
      <button class="apply-btn" id="apply-btn" onclick="applyChanges()" disabled>
        Apply Changes (0)
      </button>
    </div>
  </div>
</div>

<script>
let fetching = false;
let applying = false;
let savedCredentials = null;

// {isoDate: bool|null}  — truth from last API response
let currentEntryState = {};
// {isoDate: bool}       — user's desired state (only dates where a roll-up exists)
let desiredEntryState = {};
// {isoDate: string[]}   — player names per date
let playerNamesMap = {};

// Currently visible players panel date
let activePpDate = null;

// ── Utility ───────────────────────────────────────────────────────────────────

function show(id) {
  ['login','loading','results'].forEach(s => {
    document.getElementById(s).style.display = s === id ? 'block' : 'none';
  });
}

function statusHtml(status) {
  if (status === 'cross') return '<span class="status-cross">✗</span>';
  if (status === 'error') return '<span class="status-error">?</span>';
  if (status === '10:00') return `<span class="status-tick">${status}</span>`;
  return `<span class="status-time">${status}</span>`;
}

// Count pending changes (desired !== current, and current is not null)
function countPending() {
  let n = 0;
  for (const [date, desired] of Object.entries(desiredEntryState)) {
    const current = currentEntryState[date];
    if (current !== null && current !== undefined && desired !== current) n++;
  }
  return n;
}

function updateApplyButton() {
  const n = countPending();
  const btn = document.getElementById('apply-btn');
  btn.disabled = n === 0 || applying;
  btn.innerHTML = applying
    ? `<span class="btn-spinner"></span>Applying…`
    : `Apply Changes (${n})`;
}

// Recompute pending-change row highlight and checkbox states without full re-render
function refreshRowStates() {
  document.querySelectorAll('tr[data-mon-iso]').forEach(tr => {
    const monIso = tr.dataset.monIso;
    const thuIso = tr.dataset.thuIso;
    const monPending = currentEntryState[monIso] !== null &&
      currentEntryState[monIso] !== undefined &&
      desiredEntryState[monIso] !== undefined &&
      desiredEntryState[monIso] !== currentEntryState[monIso];
    const thuPending = currentEntryState[thuIso] !== null &&
      currentEntryState[thuIso] !== undefined &&
      desiredEntryState[thuIso] !== undefined &&
      desiredEntryState[thuIso] !== currentEntryState[thuIso];
    const wasPending = tr.classList.contains('pending-change');
    const nowPending = monPending || thuPending;
    if (nowPending !== wasPending) {
      tr.classList.toggle('pending-change', nowPending);
    }
  });
  updateApplyButton();
}

// ── Players panel ─────────────────────────────────────────────────────────────

function showPlayers(isoDate) {
  const names = playerNamesMap[isoDate];
  const panel = document.getElementById('players-panel');

  // Toggle off if same date clicked again
  if (activePpDate === isoDate && panel.style.display !== 'none') {
    hidePlayers();
    return;
  }

  activePpDate = isoDate;

  // Build friendly date label
  const dateObj = new Date(isoDate + 'T12:00:00Z');
  const days   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const label  = `${days[dateObj.getUTCDay()]} ${dateObj.getUTCDate()} ${months[dateObj.getUTCMonth()]}`;

  document.getElementById('pp-title').textContent = `Players — ${label}`;

  const namesEl = document.getElementById('pp-names');
  if (!names || names.length === 0) {
    namesEl.textContent = 'No players signed up yet.';
  } else {
    namesEl.innerHTML = names.map((n, i) => `${i + 1}. ${n}`).join('<br>');
  }

  panel.style.display = 'block';
}

function hidePlayers() {
  activePpDate = null;
  document.getElementById('players-panel').style.display = 'none';
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderResults(data) {
  const today = new Date().toISOString().split('T')[0];
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';

  // Rebuild state maps from fresh API data
  currentEntryState = {};
  desiredEntryState = {};
  playerNamesMap = {};

  hidePlayers();

  (data.rows || []).forEach(row => {
    // Record current entry state from API
    currentEntryState[row.monIso] = row.monEntered ?? null;
    currentEntryState[row.thuIso] = row.thuEntered ?? null;
    // Initialise desired to match current
    if (row.monEntered !== null && row.monEntered !== undefined) {
      desiredEntryState[row.monIso] = row.monEntered;
    }
    if (row.thuEntered !== null && row.thuEntered !== undefined) {
      desiredEntryState[row.thuIso] = row.thuEntered;
    }
    // Store player names
    if (row.monNames) playerNamesMap[row.monIso] = row.monNames;
    if (row.thuNames) playerNamesMap[row.thuIso] = row.thuNames;
  });

  (data.rows || []).forEach(row => {
    const isCurrentWeek = row.monIso <= today && today <= row.thuIso;
    const isPast = row.thuIso < today;
    const tr = document.createElement('tr');
    tr.dataset.monIso = row.monIso;
    tr.dataset.thuIso = row.thuIso;

    if (isCurrentWeek) tr.classList.add('today-row');
    else if (isPast)   tr.classList.add('past-week');

    tr.innerHTML = buildRowHtml(row);
    tbody.appendChild(tr);
  });

  document.getElementById('as-of').textContent =
    `Fetched ${new Date(data.fetchedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`;

  show('results');
  updateApplyButton();
}

function buildRowHtml(row) {
  const monHasRollup = row.monStatus !== 'cross' && row.monStatus !== 'error';
  const thuHasRollup = row.thuStatus !== 'cross' && row.thuStatus !== 'error';

  const monCbHtml = buildCheckboxHtml(row.monIso, row.monEntered, monHasRollup, 'mon');
  const thuCbHtml = buildCheckboxHtml(row.thuIso, row.thuEntered, thuHasRollup, 'thu');

  const monCountRaw = (monHasRollup && row.monCount !== null) ? row.monCount : null;
  const thuCountRaw = (thuHasRollup && row.thuCount !== null) ? row.thuCount : null;

  // Make count clickable if we have names data (or count > 0)
  const monCountHtml = monCountRaw !== null
    ? `<span class="count-link" onclick="showPlayers('${row.monIso}')" title="Click to see players">${monCountRaw}</span>`
    : '';
  const thuCountHtml = thuCountRaw !== null
    ? `<span class="count-link" onclick="showPlayers('${row.thuIso}')" title="Click to see players">${thuCountRaw}</span>`
    : '';

  return `
    <td class="date-cell"><a href="#" onclick="event.preventDefault();openSheet('${row.monIso}')">${row.monDisplay}</a></td>
    <td class="status-cell">${statusHtml(row.monStatus)}</td>
    <td class="count-cell">${monCountHtml}</td>
    <td class="entry-cell">${monCbHtml}</td>
    <td class="date-cell thu-date-cell"><a href="#" onclick="event.preventDefault();openSheet('${row.thuIso}')">${row.thuDisplay}</a></td>
    <td class="status-cell">${statusHtml(row.thuStatus)}</td>
    <td class="count-cell">${thuCountHtml}</td>
    <td class="entry-cell">${thuCbHtml}</td>
  `;
}

function buildCheckboxHtml(isoDate, isEntered, hasRollup, side) {
  if (!hasRollup) {
    // No roll-up exists — show a disabled unchecked checkbox
    return `<input type="checkbox" class="entry-cb" disabled title="No roll-up on this date"/>`;
  }
  const checked  = isEntered === true  ? 'checked' : '';
  const disabled = isEntered === null  ? 'disabled' : '';
  const title    = isEntered === null  ? 'Entry state unknown' :
                   isEntered           ? 'Entered — uncheck to withdraw' :
                                        'Not entered — check to enter';
  return `<input type="checkbox" class="entry-cb" ${checked} ${disabled}
    data-iso="${isoDate}"
    title="${title}"
    onchange="onCheckboxChange('${isoDate}', this.checked)"/>`;
}

// ── Open tee sheet in browser ─────────────────────────────────────────────────

function openSheet(isoDate) {
  const [y, m, d] = isoDate.split('-');
  window.open(`https://www.bramleygolfclub.co.uk/memberbooking/?date=${d}-${m}-${y}`, '_blank');
}

// ── Checkbox interaction ──────────────────────────────────────────────────────

function onCheckboxChange(isoDate, checked) {
  desiredEntryState[isoDate] = checked;
  refreshRowStates();
}

// ── Apply changes ─────────────────────────────────────────────────────────────

async function applyChanges() {
  if (applying || !savedCredentials) return;
  const pending = [];
  for (const [date, desired] of Object.entries(desiredEntryState)) {
    const current = currentEntryState[date];
    if (current !== null && current !== undefined && desired !== current) {
      pending.push({ date, action: desired ? 'enter' : 'withdraw' });
    }
  }
  if (pending.length === 0) return;

  applying = true;
  updateApplyButton();

  // Disable all checkboxes while applying
  document.querySelectorAll('.entry-cb:not(:disabled)').forEach(cb => {
    cb.dataset.wasEnabled = '1';
    cb.disabled = true;
  });

  try {
    const resp = await fetch('/api/moths-action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        member_id: savedCredentials.memberId,
        pin: savedCredentials.pin,
        actions: pending,
      }),
    });
    const data = await resp.json();
    if (data.status === 'error') throw new Error(data.message);

    // Process results
    (data.results || []).forEach(result => {
      const tr = document.querySelector(`tr[data-mon-iso="${result.date}"], tr[data-thu-iso="${result.date}"]`);
      if (result.success) {
        // Update current state to reflect the action taken
        currentEntryState[result.date] = result.action === 'enter';
        desiredEntryState[result.date] = currentEntryState[result.date];
        if (tr) {
          tr.classList.remove('action-error');
          tr.classList.add('action-success');
          setTimeout(() => tr.classList.remove('action-success'), 2500);
        }
        // Update the specific checkbox
        const cb = document.querySelector(`.entry-cb[data-iso="${result.date}"]`);
        if (cb) {
          cb.checked = currentEntryState[result.date];
          cb.title = currentEntryState[result.date]
            ? 'Entered — uncheck to withdraw'
            : 'Not entered — check to enter';
        }
      } else {
        // Revert desired state on failure
        desiredEntryState[result.date] = currentEntryState[result.date];
        if (tr) {
          tr.classList.remove('action-success');
          tr.classList.add('action-error');
          setTimeout(() => tr.classList.remove('action-error'), 3500);
        }
        // Revert checkbox visual
        const cb = document.querySelector(`.entry-cb[data-iso="${result.date}"]`);
        if (cb) cb.checked = !!currentEntryState[result.date];
      }
    });

  } catch (e) {
    // Revert all desired states on total failure
    for (const { date } of pending) {
      desiredEntryState[date] = currentEntryState[date];
      const cb = document.querySelector(`.entry-cb[data-iso="${date}"]`);
      if (cb) cb.checked = !!currentEntryState[date];
    }
    // Show a brief error in the footer area
    const btn = document.getElementById('apply-btn');
    btn.textContent = e.message || 'Apply failed — try again';
    setTimeout(() => updateApplyButton(), 3000);
  } finally {
    applying = false;
    // Re-enable checkboxes that were enabled before
    document.querySelectorAll('.entry-cb[data-was-enabled]').forEach(cb => {
      cb.disabled = false;
      delete cb.dataset.wasEnabled;
    });
    refreshRowStates();
    updateApplyButton();
  }
}

// ── Fetch ─────────────────────────────────────────────────────────────────────

async function startFetch() {
  if (fetching) return;
  const memberId = document.getElementById('member_id').value.trim();
  const pin      = document.getElementById('pin').value.trim();
  const errEl    = document.getElementById('err');
  const btn      = document.getElementById('go-btn');

  errEl.style.display = 'none';
  if (!memberId || !pin) {
    errEl.textContent = 'Please enter your Member ID and PIN.';
    errEl.style.display = 'block';
    return;
  }

  fetching = true;
  btn.disabled = true;
  show('loading');
  document.getElementById('loading-msg').textContent = 'Fetching roll up schedule… (this may take 20–30 seconds)';

  try {
    const resp = await fetch('/api/moths', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({member_id: memberId, pin}),
    });
    if (!resp.ok && resp.headers.get('content-type')?.includes('application/json') === false)
      throw new Error('Request timed out — please try again.');
    const data = await resp.json();
    if (data.status === 'error') throw new Error(data.message);
    savedCredentials = { memberId, pin };
    renderResults(data);
  } catch(e) {
    show('login');
    errEl.textContent = e.message || 'Could not connect — please try again.';
    errEl.style.display = 'block';
  } finally {
    fetching = false;
    btn.disabled = false;
  }
}

async function refresh() {
  if (!savedCredentials) { show('login'); return; }
  if (fetching) return;
  fetching = true;
  show('loading');
  document.getElementById('loading-msg').textContent = 'Refreshing roll up schedule…';
  try {
    const resp = await fetch('/api/moths', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ member_id: savedCredentials.memberId, pin: savedCredentials.pin }),
    });
    if (!resp.ok && resp.headers.get('content-type')?.includes('application/json') === false)
      throw new Error('Request timed out — please try again.');
    const data = await resp.json();
    if (data.status === 'error') throw new Error(data.message);
    renderResults(data);
  } catch(e) {
    show('results');
  } finally {
    fetching = false;
  }
}

function togglePin() {
  const input = document.getElementById('pin');
  const icon  = document.getElementById('eye-icon');
  const show  = input.type === 'password';
  input.type  = show ? 'text' : 'password';
  icon.innerHTML = show
    ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
    : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login').style.display !== 'none') {
    startFetch();
  }
});
