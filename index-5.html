<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>My Bramley Schedule</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    .header {
      background: #1a3a5c;
      color: #fff;
      padding: 18px 20px 14px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header p {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 3px;
    }

    /* ── Login form ── */
    .form-body {
      padding: 20px;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      margin-bottom: 5px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      color: #111;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus {
      border-color: #1a3a5c;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #1a3a5c;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .error-msg {
      color: #c0392b;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }

    /* ── Loading ── */
    #loading {
      display: none;
      padding: 40px 20px;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #eee;
      border-top-color: #1a3a5c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p {
      color: #777;
      font-size: 14px;
    }

    /* ── Results ── */
    #results {
      display: none;
    }
    .results-header {
      padding: 14px 20px 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    .results-header .summary {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }
    .results-header .as-of {
      font-size: 11px;
      color: #aaa;
    }

    .entry {
      padding: 12px 20px;
      border-bottom: 1px solid #f5f5f5;
    }
    .entry:last-child { border-bottom: none; }

    .entry-date {
      font-size: 12px;
      color: #777;
      margin-bottom: 5px;
    }
    .entry-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      padding: 2px 9px;
      border-radius: 20px;
      line-height: 18px;
    }
    .entry-name {
      font-size: 15px;
      font-weight: 600;
      color: #111;
      line-height: 1.3;
      flex: 1;
      min-width: 0;
    }
    .entry-link {
      display: block;
      margin-top: 6px;
      color: #2471a3;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
    }
    .clash-badge {
      display: inline-block;
      background: #e74c3c;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 8px;
      margin-left: 5px;
      vertical-align: middle;
    }

    .clash-warning {
      margin: 0 20px 16px;
      padding: 10px 14px;
      background: #fdf2f2;
      border-left: 4px solid #e74c3c;
      border-radius: 6px;
      font-size: 13px;
    }
    .clash-warning strong { display: block; margin-bottom: 4px; }
    .clash-warning ul { padding-left: 16px; margin: 0; }
    .clash-warning li { margin-top: 2px; }

    .reset-btn {
      display: block;
      margin: 16px 20px 20px;
      text-align: center;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>⛳ My Bramley Schedule</h1>
    <p>Sign in with your Intelligent Golf credentials</p>
  </div>

  <!-- Login form -->
  <div id="login">
    <div class="form-body">
      <div class="field">
        <label>Member ID / Email</label>
        <input id="member_id" type="email" inputmode="email"
               autocomplete="email" placeholder="your@email.com"/>
      </div>
      <div class="field">
        <label>PIN</label>
        <input id="pin" type="password" inputmode="numeric"
               autocomplete="current-password" placeholder="••••"/>
      </div>
      <button class="btn" id="go-btn" onclick="startFetch()">Get My Schedule</button>
      <div class="error-msg" id="err"></div>
    </div>
  </div>

  <!-- Loading -->
  <div id="loading" style="display:none">
    <div class="spinner"></div>
    <p id="loading-msg">Fetching your schedule…</p>
  </div>

  <!-- Results -->
  <div id="results" style="display:none">
    <div class="results-header">
      <div id="summary" class="summary"></div>
      <div id="as-of" class="as-of"></div>
    </div>
    <div id="entries"></div>
    <div id="clash-block"></div>
    <span class="reset-btn" onclick="reset()">← Search again</span>
  </div>
</div>

<script>
let pollTimer = null;

function show(id) {
  ['login','loading','results'].forEach(s => {
    document.getElementById(s).style.display = s === id ? '' : 'none';
  });
}

async function startFetch() {
  const memberId = document.getElementById('member_id').value.trim();
  const pin      = document.getElementById('pin').value.trim();
  const errEl    = document.getElementById('err');

  errEl.style.display = 'none';
  if (!memberId || !pin) {
    errEl.textContent = 'Please enter your Member ID and PIN.';
    errEl.style.display = 'block';
    return;
  }

  show('loading');
  document.getElementById('loading-msg').textContent = 'Fetching your schedule…';

  try {
    const resp = await fetch('/api/schedule', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({member_id: memberId, pin}),
    });
    const data = await resp.json();
    if (data.status === 'error') throw new Error(data.message);
    renderResults(data);
  } catch(e) {
    show('login');
    errEl.textContent = e.message || 'Could not connect — please try again.';
    errEl.style.display = 'block';
  }
}

function typeInfo(type) {
  const map = {
    'tee-time':    { label:'Tee Time',   colour:'#117a65' },
    'roll-up':     { label:'Roll Up',    colour:'#b7770d' },
    'competition': { label:'Competition',colour:'#1e8449' },
    'knockout':    { label:'Knockout',   colour:'#6c3483' },
    'match':       { label:'Match',      colour:'#1a5276' },
  };
  return map[type] || { label: type, colour: '#555' };
}

function renderResults(data) {
  const items = data.items || [];

  // Summary
  const teeCount  = items.filter(i => i.type==='tee-time'||i.type==='roll-up').length;
  const compCount = items.filter(i => i.type==='competition'||i.type==='knockout'||i.type==='match').length;
  document.getElementById('summary').textContent = `${teeCount} tee time(s)  ·  ${compCount} competition(s)`;
  document.getElementById('as-of').textContent = `Fetched ${new Date(data.fetchedAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`;

  // Clash detection
  const dateCounts = {};
  items.forEach(i => { if (i.date && i.date!=='TBC') dateCounts[i.date]=(dateCounts[i.date]||0)+1; });

  const container = document.getElementById('entries');
  container.innerHTML = '';

  items.forEach(item => {
    const { label, colour } = typeInfo(item.type);
    const clash = item.date && item.date!=='TBC' && (dateCounts[item.date]||0)>1;
    const clashHtml = clash ? '<span class="clash-badge">CLASH</span>' : '';

    // Date display
    let dateDisplay = '';
    if (item.isPlayBy && item.playByDate) {
      dateDisplay = `PLAY BY ${item.playByDate}`;
    } else if (item.isDateTbc) {
      dateDisplay = 'Date TBC';
    } else {
      dateDisplay = item.displayDate || '';
    }

    // Name display
    let nameDisplay = item.title;
    if (item.type==='tee-time' && item.players) nameDisplay = item.players;

    const linkHtml = item.link
      ? `<a class="entry-link" href="${item.link.startsWith('http')?item.link:'https://www.bramleygolfclub.co.uk/'+item.link.replace(/^\/,'')}" target="_blank">&#8594; ${item.type==='tee-time'?'View':'Details/Result'}</a>`
      : '';

    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <div class="entry-date">${dateDisplay}${clashHtml}</div>
      <div class="entry-row">
        <span class="badge" style="background:${colour}">${label}</span>
        <span class="entry-name">${nameDisplay}</span>
      </div>
      ${linkHtml}
    `;
    container.appendChild(div);
  });

  // Clash summary
  const clashDates = [...new Set(items.filter(i=>i.date&&i.date!=='TBC'&&(dateCounts[i.date]||0)>1).map(i=>i.date))];
  const clashBlock = document.getElementById('clash-block');
  if (clashDates.length) {
    clashBlock.innerHTML = `<div class="clash-warning"><strong>⚠️ Possible clashes on ${clashDates.length} date(s)</strong></div>`;
  } else {
    clashBlock.innerHTML = '';
  }

  show('results');
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  const n = d.getDate();
  const suffix = [,'st','nd','rd'][((n%100)>>3)^1&&n%10] || 'th';
  return `${days[d.getDay()]} ${n}${suffix} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function reset() {
  clearInterval(pollTimer);
  document.getElementById('pin').value = '';
  document.getElementById('err').style.display = 'none';
  show('login');
}

// Allow Enter key to submit
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login').style.display !== 'none') {
    startFetch();
  }
});
</script>
</body>
</html>
